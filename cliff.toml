# git-cliff config: tools/release.sh generates each CHANGELOG.md entry from the conventional commits since the last
# release tag and inserts it under the file's header itself, so there is no header here. The first release's entry is
# written by hand; generation starts from the first tag.
# Run: npx --yes git-cliff@2.14.2 --unreleased --tag v<version> --strip all
#
# What players see is decided per commit:
#   - feat goes under Added, fix under Fixed, perf and refactor under Changed;
#   - scopes dev, tools, build, ci and deps, and docs, chores, style and tests, are left out;
#   - a "Changelog: skip" footer leaves a commit out;
#   - a "Changelog: <sentence>" footer replaces the subject with that sentence.

[changelog]
body = """
## {% if version %}{{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
{%- set own = commit.footers | filter(attribute="token", value="Changelog") %}
- {% if own | length > 0 %}{{ own | first | get(key="value") | trim | upper_first }}{% else %}{% if commit.scope %}**{{ commit.scope | lower }}**: {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}{% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { footer = "^[Cc]hangelog: ?skip$", skip = true },
  { message = "^[a-z]+\\((dev|tools|build|ci|deps)\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
